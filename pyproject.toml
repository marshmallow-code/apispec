[project]
name = "apispec"
version = "6.10.0"
description = "A pluggable API specification generator. Currently supports the OpenAPI Specification (f.k.a. the Swagger specification)."
readme = "README.rst"
license = "MIT"
authors = [{ name = "Steven Loria", email = "oss@stevenloria.com" }]
maintainers = [
  { name = "Steven Loria", email = "oss@stevenloria.com" },
  { name = "Jérôme Lafréchoux", email = "jerome@jolimont.fr" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = [
  "apispec",
  "swagger",
  "openapi",
  "specification",
  "oas",
  "documentation",
  "spec",
  "rest",
  "api",
]
requires-python = ">=3.10"
dependencies = ["packaging>=21.3"]

[project.urls]
Changelog = "https://apispec.readthedocs.io/en/latest/changelog.html"
Funding = "https://opencollective.com/marshmallow"
Issues = "https://github.com/marshmallow-code/apispec/issues"
Source = "https://github.com/marshmallow-code/apispec"
Tidelift = "https://tidelift.com/subscription/pkg/pypi-apispec?utm_source=pypi-apispec&utm_medium=pypi"

[project.optional-dependencies]
yaml = ["PyYAML>=3.10"]
marshmallow = ["marshmallow>=3.18.0"]

[dependency-groups]
docs = ["marshmallow>=4.0.0", "pyyaml", "sphinx-issues", "furo", "sphinx>=8.1"]
tests = ["openapi-spec-validator", "pytest"]
lint = ["pre-commit>=3.5,<5.0"]
dev = [
  { include-group = "tests" },
  { include-group = "lint" },
  "tox",
  "tox-uv",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "1 week"

[build-system]
requires = ["flit_core<5"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = [
  "docs/",
  "tests/",
  "CHANGELOG.rst",
  "SECURITY.md",
  "tox.ini",
]
exclude = ["docs/_build/"]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["E203", "E266", "E501", "E731"]
select = [
  "B",  # flake8-bugbear
  "E",  # pycodestyle error
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "W",  # pycodestyle warning
]

[tool.mypy]
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
